ekf_filter_node_odom:
  ros__parameters:
    two_d_mode: true
    publish_tf: true

    base_link_frame: base_footprint
    world_frame: odom

    odom0: /diff_drive_cont/odom
    odom0_config: [ false, false, false,
                  false, false, false,
                  true, true, true,
                  false, false, true,
                  false, false, false ]

    imu0: /zed/zed_node/imu/data
    imu0_config: [ false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false ]

ekf_filter_node_map:
  ros__parameters:
    two_d_mode: true
    publish_tf: true

    base_link_frame: base_footprint
    world_frame: map

    odom1: odometry/gps
    odom1_config: [ true, true, false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false ]

navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: false
    # datum: [38.161491, -122.4546443, 0.0] # pre-set datum if needed, [lat, lon, yaw]
